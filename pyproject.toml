[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-intelligence-ai"
version = "0.1.0"
description = "AI-assisted portfolio movement investigation system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alpaca-py>=0.30,<1",
    "python-dotenv>=1,<2",
    "exchange-calendars>=4,<5",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1"
]
ai = [
    "langgraph>=0.2,<2",
    "openai>=1.60,<3",
    "transformers>=4.48,<5",
    "torch>=2.5,<3"
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
