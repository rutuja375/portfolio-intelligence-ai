[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-intelligence-ai"
version = "0.1.0"
description = "AI-assisted portfolio movement investigation system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alpaca-py>=0.30,<1",
    "python-dotenv>=1,<2",
    "exchange-calendars>=4,<5"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1"
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]